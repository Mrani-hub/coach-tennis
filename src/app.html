<title>Coach Tennis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d5c45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: app mobile — en-tête court, contenu défilant, barre d'onglets fixe en bas ; semaine en 7 colonnes sur grand écran */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --surface-2:#f7f9f5; --ink:#15231c; --muted:#5b6a61; --line:#d8e0d6;
  --court:#1d5c45; --court-ink:#ffffff; --court-soft:#e0eee6;
  --clay:#b9582a; --clay-soft:#f7e5d9;
  --ball:#d6ea3a; --ball-ink:#1b2a06;
  --danger:#bb3426; --danger-soft:#fbe3df; --ok:#2b7a4b; --ok-soft:#e1f2e7; --warn:#9a6a00; --warn-soft:#fbf0d2;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  /* couleurs fixes par thème (graphique) */
  --c1:#1d5c45; --c2:#b9582a; --c3:#b88a00; --c4:#2f6fa8; --c5:#8a4f9e; --c6:#23897c; --c7:#c2456b; --c8:#66782a; --c9:#5b6672;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#4aa882;--c2:#e28a59;--c3:#e5bd3c;--c4:#6aa6dd;--c5:#b98ad0;--c6:#4ec2b2;--c7:#ec7d9c;--c8:#a7bb57;--c9:#9aa6b3}}
:root[data-theme="dark"]{--c1:#4aa882;--c2:#e28a59;--c3:#e5bd3c;--c4:#6aa6dd;--c5:#b98ad0;--c6:#4ec2b2;--c7:#ec7d9c;--c8:#a7bb57;--c9:#9aa6b3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211b; --surface-2:#1b2821; --ink:#e6eee8; --muted:#9aaaa0; --line:#28382f;
  --court:#4aa882; --court-ink:#07140e; --court-soft:#18352a;
  --clay:#e28a59; --clay-soft:#3a2418;
  --ball:#d6ea3a; --ball-ink:#1b2a06;
  --danger:#ef6f5f; --danger-soft:#3c1f1b; --ok:#5cc58a; --ok-soft:#173326; --warn:#e7b84a; --warn-soft:#3a2f12;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --surface-2:#1b2821; --ink:#e6eee8; --muted:#9aaaa0; --line:#28382f;
  --court:#4aa882; --court-ink:#07140e; --court-soft:#18352a;
  --clay:#e28a59; --clay-soft:#3a2418;
  --ball:#d6ea3a; --ball-ink:#1b2a06;
  --danger:#ef6f5f; --danger-soft:#3c1f1b; --ok:#5cc58a; --ok-soft:#173326; --warn:#e7b84a; --warn-soft:#3a2f12;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--court)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--court);color:var(--court-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .ball{width:26px;height:26px;border-radius:50%;background:var(--ball);position:relative;flex:none;overflow:hidden}
.brand .ball::before,.brand .ball::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fff;border-radius:50%;top:0}
.brand .ball::before{left:-17px}.brand .ball::after{right:-17px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.brand small{display:block;font-size:12px;opacity:.85;letter-spacing:.02em}
.top .sp{flex:1}
.btn-top{background:var(--ball);color:var(--ball-ink);border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--court)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn.pri{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.btn.clay{background:var(--clay);color:#fff;border-color:var(--clay)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn:focus-visible,.tab:focus-visible,.ev:focus-visible,.prow:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ball);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.cat{background:var(--ball);color:var(--ball-ink);border-color:transparent;font-family:var(--f-display);letter-spacing:.04em;font-size:13px}
.chip.ind{background:var(--court-soft);color:var(--court);border-color:transparent}
.chip.col{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.chip.st-faite{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.st-absent{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.st-annulee{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.conf{background:var(--danger);color:#fff;border-color:transparent}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:32px;line-height:1;font-weight:700}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--danger)}

/* events */
.ev{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--court);border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.ev.col{border-left-color:var(--clay)}
.ev.off{opacity:.55}
.ev.off .t-name{text-decoration:line-through}
.ev.bad{box-shadow:inset 0 0 0 1px var(--danger)}
.ev .t-time{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;grid-row:span 2;min-width:46px}
.ev .t-time i{display:block;font-style:normal;color:var(--muted);font-size:14px}
.ev .t-name{font-weight:700;min-width:0}
.ev .t-sub{font-size:13px;color:var(--muted);min-width:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}

/* week */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekbar .lbl{font-family:var(--f-display);font-size:20px;font-weight:600;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day-h b{font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.day-h span{font-size:12px;color:var(--muted)}
.day .free{font-size:13px;color:var(--muted);padding:6px 2px}
.week .ev{grid-template-columns:1fr;padding:7px 8px}
.week .ev .t-time{grid-row:auto;font-size:14px}
.week .ev .t-time i{display:inline;font-size:13px}
.week .ev .t-name{font-size:14px;line-height:1.25}
@media (max-width:900px){.week{grid-template-columns:1fr}.week .ev{grid-template-columns:auto 1fr}.week .ev .t-time{grid-row:span 2}.week .ev .t-time i{display:block}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

/* players */
.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.prow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.av{width:40px;height:40px;border-radius:50%;background:var(--court-soft);color:var(--court);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.prow .pi{min-width:0;flex:1}
.prow .pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* schools */
.school{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.school-h{padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--clay-soft)}
.school-h h4{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.grp{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.grp:last-child{border-bottom:0}
.grp .gi{min-width:0;flex:1}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.slot{font-size:13px;border:1px dashed var(--clay);color:var(--clay);border-radius:6px;padding:2px 8px;font-weight:600}

/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:118px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bar b{text-align:right;font-weight:600}
.bar b em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
/* niveaux */
.lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.lv{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.lv.focus{border-color:var(--court);background:var(--court-soft)}
.lv-t{flex:1;font-size:14px;font-weight:600;min-width:0}
.stars{display:flex;gap:0}
.star{background:none;border:0;padding:2px 3px;font-size:21px;line-height:1;cursor:pointer;color:var(--line)}
.star.on{color:#e0a800}
.star:focus-visible{outline:2px solid var(--court);border-radius:4px}
.trend{font-size:11px;font-weight:700;white-space:nowrap;min-width:52px;text-align:right}
.trend.up{color:var(--ok)}.trend.down{color:var(--danger)}
.throw{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:6px;align-items:center}
.throw select,.throw input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);min-width:0;width:100%}
.pct{position:relative}.pct::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.pct input{padding-right:24px}
.lbl-f{font-size:13px;font-weight:600;color:var(--muted)}
.sep{border:0;border-top:2px dashed var(--line);margin:4px 0}
.dsp{font-size:12px;color:var(--muted);font-weight:600}
.dsp.cg{color:var(--clay)}
.day.rest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--bg) 8px 16px)}
.free-slot{border:1px dashed var(--court);color:var(--court);background:transparent;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.free-slot:hover{background:var(--court-soft)}
.chip.hd{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ev.hd{box-shadow:inset 0 0 0 1px var(--warn)}
.drow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
@media (max-width:520px){.drow{grid-template-columns:1fr}}
.dday{display:flex;gap:8px;align-items:center;cursor:pointer}
.dday input{width:18px;height:18px;accent-color:var(--court)}
.dr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.rng{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:2px 2px 2px 8px;background:var(--surface-2)}
.rng input{border:0;background:transparent;padding:5px 2px;color:var(--ink)}
.cgl{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:0 8px 8px 0;background:var(--surface-2);flex-wrap:wrap}
.prep{border:1px solid var(--court);border-radius:var(--r);background:var(--court-soft);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prep summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prep p{margin:6px 0 0}
.ptab{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.prw{display:grid;grid-template-columns:minmax(118px,1fr) 74px 66px 78px 40px 30px 36px;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 8px;font-size:14px;min-width:470px}
.prw .sc{font-weight:700;text-align:center}
@media (max-width:480px){.prw{grid-template-columns:minmax(0,1fr) 62px 60px 32px 28px 34px;min-width:0;font-size:13px}.prw>:nth-child(4){display:none}.prw .sstars{font-size:12px}}
.ibtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--court);background:var(--surface);color:var(--court);font:italic 700 14px Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn[aria-expanded="true"]{background:var(--court);color:var(--court-ink)}
.why{margin:2px 0 6px;padding:10px 12px;border:1px solid var(--court);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.why-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why-r{display:grid;grid-template-columns:minmax(0,1fr) 70px 52px;gap:8px;align-items:center;font-size:13px}
.why-b{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.why-b i{display:block;height:100%;background:var(--clay)}
.why-r b{text-align:right}.why-r em{font-style:normal;color:var(--muted);font-weight:400}
@media (max-width:460px){.why-r{grid-template-columns:minmax(0,1fr) 52px}.why-b{display:none}}
.lg.zero span,.lg.zero b{color:var(--muted)}
.lg.zero i{background:transparent!important;border:2px dashed var(--muted)}
.lg.zero em{color:var(--clay);font-weight:700}
.lg.zero.ext i{border-style:solid;border-color:var(--line)}
.lg.zero.ext em{color:var(--muted);font-weight:600}
.chip.ext{font-size:11px;padding:1px 6px;color:var(--muted);vertical-align:1px}
.exrow{display:grid;grid-template-columns:120px 170px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.exrow select,.exrow input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);min-width:0;width:100%}
@media (max-width:520px){.exrow{grid-template-columns:1fr 1fr}.exrow input{grid-column:1/-1}}
.prw.hd{background:transparent;border:0;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:0}
.prw.top{border-color:var(--clay)}
.prw .btn{padding:4px 0;font-size:16px;line-height:1}
.pt{min-width:0;font-weight:600}
.sstars{color:#e0a800;letter-spacing:-1px;white-space:nowrap}
.sstars i{font-style:normal;color:var(--line)}
.chip.prio{background:var(--clay);color:#fff;border-color:transparent;font-size:10px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.dwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:176px;height:176px;flex:none;max-width:100%}
.dn-big{font-family:var(--f-display);font-size:22px;font-weight:700;fill:var(--ink)}
.dn-sm{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.lgs{flex:1;min-width:210px;display:flex;flex-direction:column;gap:5px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) 40px 84px;gap:8px;align-items:center;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px}
.lg b{text-align:right}
.lg em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
.clrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.mstr{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 64px;gap:6px;align-items:center;font-size:13px}
.mstr input,.coupt input{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.mstr.hd,.coupt.hd,.cmp.hd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:transparent;border:0}
.msec{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;color:var(--clay);font-size:14px;margin-top:6px;text-transform:uppercase}
.coupt{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:6px;align-items:center;font-size:13px}
.cmp{display:grid;grid-template-columns:118px 70px 108px minmax(0,1fr);gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;min-width:440px}
@media (max-width:520px){.cmp{grid-template-columns:minmax(0,1fr) auto auto;min-width:0}.cmp>:nth-child(4){grid-column:1/-1}.cmp.hd>:nth-child(4){display:none}}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:0 8px 8px 0;background:var(--surface-2);cursor:pointer;font-size:14px}
.mrow:hover{border-color:var(--clay)}
.chip.mfort{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.mfaible{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.mmixte{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.mdot{font-size:10px;margin-left:5px;vertical-align:1px}.mdot.fort{color:var(--ok)}.mdot.faible{color:var(--danger)}.mdot.mixte{color:var(--warn)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.mcols{grid-template-columns:1fr}}
.mlist{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}

<script>
/* ============ Données & utilitaires ============ */
const KEY='uscm-coach-v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>{const g=parse(s).getDay();return g===0?7:g};
const monday=s=>addDays(s,1-dow(s));
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const today=()=>iso(new Date());
const JOURS=['','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JC=['','Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MOIS[d.getMonth()]}`};
const fmtH=min=>{const h=Math.floor(min/60),m=min%60;return !h?`${m} min`:m?`${h} h ${pad(m)}`:`${h} h`};
const THEMES=['Coup droit','Revers','Service','Retour','Volée / filet','Jeu de jambes','Tactique / match','Physique','Mental'];

const STATUTS={planifiee:'Planifiée',faite:'Faite',absent:'Absent',annulee:'Annulée'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function categorie(n){if(!n)return'—';const age=new Date().getFullYear()-(+n.slice(0,4));
  return age<=8?'U8':age<=10?'U10':age<=12?'U12':age<=14?'U14':age<=16?'U16':age<=18?'U18':'Senior'}
const pName=p=>p?`${p.prenom} ${p.nom}`:'Joueur supprimé';
const thList=s=>s.themes&&s.themes.length?s.themes:[{t:s.theme||THEMES[0],w:100}];
const thTxt=s=>{const l=thList(s);return l.length>1?l.map(x=>`${x.t} ${x.w}%`).join(' · '):l[0].t};
function migrate(o){o.seances=o.seances||[];o.joueurs=o.joueurs||[];
  o.seances.forEach(s=>{if(!s.themes)s.themes=[{t:s.theme||THEMES[0],w:100}];delete s.theme});
  o.joueurs.forEach(p=>{p.niveaux=p.niveaux||{};p.evol=p.evol||[]});
  o.dispo=o.dispo||defaultDispo();o.conges=o.conges||[];
  o.themesCoach=o.themesCoach||THEMES.slice();o.joueurs.forEach(p=>{p.externes=p.externes||{}});
  o.pays=o.pays||'Maroc';o.instanceSigle=o.instanceSigle||'FRMT';o.instanceNom=o.instanceNom||'Fédération Royale Marocaine de Tennis';
  o.joueurs.forEach(p=>{if(!p.classements)p.classements=p.classement?[{date:today(),valeur:p.classement,points:'',note:''}]:[]});
  o.matchs=o.matchs||[];o.drive=o.drive||{};return o}
const lastClassement=p=>(p.classements||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
const instTxt=()=>S.instanceSigle||S.instanceNom||'officiel';
function clHtml(p){const L=(p.classements||[]).map((c,i)=>({...c,i})).sort((a,b)=>b.date.localeCompare(a.date));
  return `${L.length?`<div class="list" style="gap:4px">${L.map((c,k)=>`<div class="clrow"><b class="num">${fmtShort(c.date)} ${c.date.slice(0,4)}</b><span><b>${esc(c.valeur)}</b>${c.points?` <span class="muted num">· ${esc(c.points)} pts</span>`:''}${k===0?' <span class="chip cat">Actuel</span>':''}${c.note?`<br><span class="small muted">${esc(c.note)}</span>`:''}</span><button class="btn ghost" type="button" data-cldel="${p.id}|${c.i}" aria-label="Supprimer ce classement">✕</button></div>`).join('')}</div>`:'<div class="muted small">Aucun classement enregistré.</div>'}
  <div class="f" style="margin-top:8px">
    <label class="fl">Date<input id="clD-${p.id}" type="date" value="${today()}"></label>
    <label class="fl">Classement<input id="clV-${p.id}" placeholder="ex. U14 · 12e national"></label>
    <label class="fl">Points (option)<input id="clP-${p.id}" inputmode="numeric"></label>
    <label class="fl">Remarque (option)<input id="clN-${p.id}" placeholder="ex. mise à jour mi-saison"></label>
    <div class="full row"><button class="btn" type="button" data-cladd="${p.id}">+ Ajouter ce classement</button><span class="small" id="clM-${p.id}"></span></div></div>`}
/* ---- Thèmes du coach / suivi externe ---- */
const isCT=t=>(S.themesCoach||THEMES).includes(t);
const CT=()=>THEMES.filter(isCT);
const themeOpts=cur=>CT().includes(cur)?CT():[...CT(),cur];
function extLabel(p,t){const e=(p.externes||{})[t];if(!e||!e.mode)return 'non suivi';return e.mode==='coach'?`coach spécialisé${e.nom?' · '+e.nom:''}`:'en autonomie'}
function extShort(p,t){const e=(p.externes||{})[t];return !e||!e.mode?'Non suivi':e.mode==='coach'?'Coach ext.':'Autonomie'}
function extHtml(p){const nc=THEMES.filter(t=>!isCT(t));if(!nc.length)return '';
  return `<div><h3 style="margin-bottom:4px">Thèmes hors de vos séances</h3><p class="small muted" style="margin:0 0 8px">Vous ne travaillez pas ces thèmes (voir Réglages). Indiquez comment ce joueur les travaille.</p>
  <div class="list" style="gap:6px">${nc.map(t=>{const i=THEMES.indexOf(t),e=(p.externes||{})[t]||{};
    return `<div class="exrow"><b>${esc(t)}</b><select data-ext="${p.id}|${i}" aria-label="Suivi ${esc(t)}">${opts([['','Non suivi'],['coach','Coach spécialisé'],['autonome','En autonomie']],e.mode||'')}</select>
      <input data-extn="${p.id}|${i}" value="${esc(e.nom||'')}" placeholder="Nom du coach ou de la structure" aria-label="Coach spécialisé pour ${esc(t)}" ${e.mode==='coach'?'':'hidden'}></div>`}).join('')}</div></div>`}
function defaultDispo(){const r=(a,b)=>[{debut:a,fin:b}];return {1:r('16:00','21:00'),2:r('16:00','21:00'),3:r('14:00','21:00'),4:r('16:00','21:00'),5:r('16:00','21:00'),6:r('09:00','18:00'),7:[]}}
/* ---- Disponibilités & congés ---- */
const congeOn=date=>(S.conges||[]).find(c=>date>=c.debut&&date<=c.fin);

const inDispo=(date,a,b)=>dispoOn(date).some(r=>toMin(r.debut)<=a&&b<=toMin(r.fin));
const rngTxt=r=>r.map(x=>`${x.debut}–${x.fin}`).join(', ');
function dayStatus(d){const c=congeOn(d);if(c)return `Congé${c.motif?' · '+esc(c.motif):''}`;const r=dispoOn(d);return r.length?`Dispo ${rngTxt(r)}`:'Repos'}
function freeSlots(date){
  const t=today();if(date<t)return [];
  let fr=dispoOn(date).map(r=>[toMin(r.debut),toMin(r.fin)]);
  if(date===t){const n=new Date(),now=Math.ceil((n.getHours()*60+n.getMinutes())/15)*15;fr=fr.map(([a,b])=>[Math.max(a,now),b]).filter(([a,b])=>b>a)}

    fr=fr.flatMap(([a,b])=>f<=a||s>=b?[[a,b]]:[[a,Math.min(b,s)],[Math.max(a,f),b]].filter(([x,y])=>y>x))});

}
const freeBtns=d=>freeSlots(d).map(([a,b])=>`<button type="button" class="free-slot num" data-newseance="${d}" data-h="${fromMin(a)}">+ Libre ${fromMin(a)}–${fromMin(b)} · ${fmtH(b-a)}</button>`).join('');
function tauxThemes(pid,since){const m={};let tot=0,n=0;
  S.seances.filter(s=>s.joueurId===pid&&s.statut==='faite'&&(!since||s.date>=since)).forEach(s=>{n++;const l=thList(s),sw=l.reduce((a,x)=>a+(+x.w||0),0)||1;
    l.forEach(x=>{const mn=(+s.duree)*(+x.w||0)/sw;m[x.t]=(m[x.t]||0)+mn;tot+=mn})});

function tauxBlock(pid,days){

  if(!tot)return seg+'<div class="muted small">Aucune séance faite sur cette période.</div>';

    <div class="lgs num">${items.map(x=>`<div class="lg"><i style="background:var(--c${x.i+1})"></i><span>${esc(x.t)}</span><b>${Math.round(x.v/tot*100)}%</b><em>${fmtH(Math.round(x.v))}</em></div>`).join('')}

      ${ext.map(t=>`<div class="lg zero ext" title="${esc(extLabel(p,t))}"><i></i><span>${esc(t)}</span><b>—</b><em>${esc(extShort(p,t))}</em></div>`).join('')}</div></div>`;
}
const initials=p=>((p.prenom||'?')[0]+(p.nom||'')[0]||'').toUpperCase();

function seed(){

async function offerFile(fn,blob,okMsg){
  if(window.Native){const r=await Native.saveFile(fn,blob,fn);if(r!=='cancelled')toast(okMsg);return}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:fn,data:blob});toast(okMsg)}
    catch(e){toast(e&&e.code==='declined'?'Enregistrement annulé':e&&e.code==='rate_limited'?'Une demande est déjà ouverte, réessayez dans un instant':'Enregistrement impossible dans cette vue')}return}
  const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(mobile&&navigator.canShare){try{const file=new File([blob],fn,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});toast(okMsg);return}}
    catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(okMsg)}

function eventsOn(date){
  const ev=[],cg=congeOn(date);
  S.seances.filter(s=>s.date===date).forEach(s=>ev.push({type:'ind',id:s.id,date,debut:s.debut,fin:fromMin(toMin(s.debut)+(+s.duree)),duree:+s.duree,court:s.court,ref:s,off:s.statut==='annulee'}));
  const j=dow(date);
  S.groupes.forEach(g=>{
    if(g.debutPeriode&&date<g.debutPeriode)return; if(g.finPeriode&&date>g.finPeriode)return;
    g.creneaux.forEach(c=>{ if(+c.jour!==j)return;
      const key=`${g.id}|${date}|${c.debut}`;
      const ann=!!S.annulations[key];
      ev.push({type:'col',key,date,debut:c.debut,fin:fromMin(toMin(c.debut)+(+c.duree)),duree:+c.duree,court:c.court,ref:g,off:ann||!!cg,conge:!!cg&&!ann});
    });
  });
  ev.sort((a,b)=>a.debut.localeCompare(b.debut));
  const act=ev.filter(e=>!e.off);
  ev.forEach(a=>{a.conflits=a.off?[]:act.filter(b=>b!==a&&toMin(a.debut)<toMin(b.fin)&&toMin(b.debut)<toMin(a.fin));
    a.enConge=!a.off&&!!cg;a.horsDispo=!a.off&&!inDispo(date,toMin(a.debut),toMin(a.fin))});
  return ev;
}
const evTitle=e=>e.type==='ind'?pName(S.joueurs.find(p=>p.id===e.ref.joueurId)):e.ref.nom;
function weekStats(m){
  let ind=0,col=0,conf=0,nb=0,dispo=0,libre=0;const conflits=[],hors=[];
  for(let i=0;i<7;i++){const d=addDays(m,i);
    dispo+=dispoOn(d).reduce((a,r)=>a+toMin(r.fin)-toMin(r.debut),0);
    libre+=freeSlots(d).reduce((a,[x,y])=>a+y-x,0);
    eventsOn(d).forEach(e=>{if(e.off)return;
    if(e.type==='ind'){ind+=e.duree;nb++}else col+=e.duree;
    if(e.conflits.length){conf++;conflits.push(e)}
    if(e.horsDispo)hors.push(e)})}
  return {ind,col,nb,conf:Math.ceil(conf/2),conflits,hors,dispo,libre};
}

/* ============ Feuilles (modales) ============ */
let sheetEl=null;
function openSheet(html){closeSheet();UI.openPid=null;sheetEl=document.createElement('div');sheetEl.className='ov';sheetEl.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet()});document.body.appendChild(sheetEl);
  const f=sheetEl.querySelector('input,select,textarea,button');if(f&&matchMedia('(min-width:700px)').matches)f.focus();}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}UI.openPid=null}
const $=id=>document.getElementById(id);
const opts=(arr,sel)=>arr.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`}).join('');
const head=t=>`<div class="sheet-h"><h2>${t}</h2><button class="btn ghost" type="button" data-close aria-label="Fermer">✕</button></div>`;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

function formSeance(s,preset={}){
  const isNew=!s;
  let pd=preset.date||today(),ph=preset.debut;
  if(isNew&&!ph){let f=freeSlots(pd);if(!preset.date&&!f.length){for(let i=1;i<14&&!f.length;i++){const d=addDays(pd,i);f=freeSlots(d);if(f.length)pd=d}}if(f.length)ph=fromMin(f[0][0])}
  s=s||{id:uid(),joueurId:preset.joueurId||(S.joueurs[0]||{}).id,date:pd,debut:ph||'17:00',duree:60,court:S.courts[0]||'Court 1',themes:[{t:THEMES[0],w:100}],statut:'planifiee',notes:preset.notes||''};
  if(!S.joueurs.length){openSheet(head('Séance individuelle')+'<div class="empty">Ajoutez d’abord un joueur.</div><button class="btn pri" type="button" data-newplayer="">+ Joueur</button>');return}
  openSheet(`${head(isNew?'Nouvelle séance':'Modifier la séance')}
  <div class="f">
    <label class="fl full">Joueur<select id="fJ">${opts(S.joueurs.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(p=>[p.id,`${pName(p)} — ${categorie(p.naissance)}`]),s.joueurId)}</select></label>
    <div class="full" id="fPrep">${prepHtml(s.joueurId,isNew?null:s.id)}</div>
    <label class="fl">Date<input id="fD" type="date" value="${s.date}"></label>
    <label class="fl">Début<input id="fH" type="time" step="900" value="${s.debut}"></label>
    <label class="fl">Durée<select id="fDu">${opts(DUREES.map(d=>[d,d+' min']),s.duree)}</select></label>
    <label class="fl">Court<select id="fC">${opts(S.courts,s.court)}</select></label>
    <div class="full list" style="gap:6px"><div class="row between"><span class="lbl-f">Thèmes et pondération</span><span id="thTot" class="small num"></span></div>
      <div id="thBox" class="list" style="gap:6px"></div>
      <div class="row"><button class="btn" type="button" id="thAdd">+ Thème</button><button class="btn ghost" type="button" id="thEq">Répartir également</button></div></div>
    ${isNew?`<label class="fl full">Répéter chaque semaine<select id="fR">${opts([[0,'Non, séance unique'],...[2,3,4,6,8,10,12].map(n=>[n-1,`${n} semaines au total`])],0)}</select></label>`:''}
    <label class="fl full">Notes<textarea id="fN" placeholder="Objectif, exercices, retour au joueur…">${esc(s.notes)}</textarea></label>
  </div>
  <div id="fWarn"></div>
  <div class="row"><button class="btn pri" type="button" id="fSave">Enregistrer</button><button class="btn" type="button" data-close>Annuler</button></div>`);
  let pristine=isNew&&!preset.theme&&!preset.themes;
  const topTh=pid=>(prioThemes(pid)[0]||{th:CT()[0]||THEMES[0]}).th;
  let ths=isNew?(preset.themes?preset.themes.map(x=>({...x})):[{t:preset.theme||topTh(s.joueurId),w:100}]):thList(s).map(x=>({t:x.t,w:+x.w}));
  const thBox=$('thBox');
  const thTotal=()=>{const sm=ths.reduce((a,x)=>a+(+x.w||0),0),el=$('thTot');
    el.textContent=sm===100?'Total 100 %':`Total ${sm} % — sera ramené à 100 %`;el.style.color=sm===100?'var(--ok)':'var(--warn)'};
  const thRender=()=>{thBox.innerHTML=ths.map((x,i)=>`<div class="throw" data-ti="${i}"><select data-tk="t" aria-label="Thème">${opts(themeOpts(x.t),x.t)}</select>
      <span class="pct"><input data-tk="w" type="number" min="0" max="100" step="5" value="${x.w}" aria-label="Pondération en %" inputmode="numeric"></span>
      <button class="btn ghost" type="button" data-trm="${i}" aria-label="Retirer ce thème" ${ths.length<2?'disabled':''}>✕</button></div>`).join('');thTotal()};
  thRender();
  thBox.addEventListener('input',e=>{const r=e.target.closest('[data-ti]');if(!r)return;const k=e.target.dataset.tk;ths[+r.dataset.ti][k]=k==='w'?Math.max(0,+e.target.value||0):e.target.value;thTotal()});
  thBox.addEventListener('change',e=>{const r=e.target.closest('[data-ti]');if(r&&e.target.dataset.tk==='t')ths[+r.dataset.ti].t=e.target.value});
  thBox.addEventListener('click',e=>{const b=e.target.closest('[data-trm]');if(!b)return;ths.splice(+b.dataset.trm,1);thRender()});
  const equal=()=>{const n=ths.length,b=Math.floor(100/n/5)*5;ths.forEach((x,i)=>x.w=b);ths[0].w+=100-b*n;thRender()};
  $('thEq').onclick=equal;
  const addTheme=t=>{
    if(pristine){pristine=false;ths=[{t,w:100}];thRender();return toast(`${t} : thème de la séance`)}
    if(ths.some(x=>x.t===t))return toast(`${t} est déjà dans la séance`);
    const rest=100-ths.reduce((a,x)=>a+(+x.w||0),0);ths.push({t,w:Math.max(0,rest)});if(rest<=0)equal();else thRender();toast(`${t} ajouté`)};
  $('thAdd').onclick=()=>{const used=ths.map(x=>x.t);pristine=false;addTheme(prioThemes($('fJ').value).map(r=>r.th).find(x=>!used.includes(x))||CT()[0])};
  thBox.addEventListener('input',()=>{pristine=false});
  $('fPrep').addEventListener('click',e=>{const b=e.target.closest('[data-addth]');if(b)addTheme(b.dataset.addth)});
  $('fJ').addEventListener('change',()=>{const pid=$('fJ').value;$('fPrep').innerHTML=prepHtml(pid,isNew?null:s.id);
    if(pristine){ths=[{t:topTh(pid),w:100}];thRender()}});
  let forced=false;
  $('fSave').onclick=()=>{
    const mg={};ths.forEach(x=>{if(+x.w>0)mg[x.t]=(mg[x.t]||0)+(+x.w)});
    let themes=Object.entries(mg).map(([t,w])=>({t,w}));
    if(!themes.length){$('fWarn').innerHTML='<div class="warnbox">Donnez une pondération supérieure à 0 à au moins un thème.</div>';return}
    const sw=themes.reduce((a,x)=>a+x.w,0);themes.forEach(x=>x.w=Math.round(x.w/sw*100));
    const diff=100-themes.reduce((a,x)=>a+x.w,0);themes.sort((a,b)=>b.w-a.w)[0].w+=diff;
    const v={joueurId:$('fJ').value,date:$('fD').value,debut:$('fH').value,duree:+$('fDu').value,court:$('fC').value,themes,notes:$('fN').value.trim()};
    if(!v.date||!v.debut){$('fWarn').innerHTML='<div class="warnbox">Indiquez une date et une heure de début.</div>';return}
    const rep=isNew?+$('fR').value:0;
    const all=[...Array(rep+1)].map((_,k)=>addDays(v.date,7*k));
    const enCg=all.filter(d=>congeOn(d)),dates=all.filter(d=>!congeOn(d));
    if(!dates.length){const c=congeOn(v.date);$('fWarn').innerHTML=`<div class="warnbox">Vous êtes en congé du ${fmtShort(c.debut)} au ${fmtShort(c.fin)}${c.motif?' ('+esc(c.motif)+')':''} : aucune séance ne peut être programmée sur cette période.</div>`;return}
    const a=toMin(v.debut),b=a+v.duree,clash=[];
    dates.forEach(d=>{
      if(!inDispo(d,a,b)){const r=dispoOn(d);clash.push(`${fmtDate(d)} : hors de vos disponibilités (${r.length?rngTxt(r):'jour de repos'})`)}
      eventsOn(d).forEach(e=>{if(e.off||(e.type==='ind'&&e.id===s.id))return;if(a<toMin(e.fin)&&toMin(e.debut)<b)clash.push(`${fmtDate(d)} ${e.debut}–${e.fin} : déjà occupé par ${evTitle(e)}${e.court===v.court?' (même court)':''}`)})});
    if(clash.length&&!forced){forced=true;$('fWarn').innerHTML=`<div class="warnbox">À vérifier avant d’enregistrer :<br>${clash.slice(0,6).map(esc).join('<br>')}${clash.length>6?'<br>…':''}</div>`;$('fSave').textContent='Enregistrer quand même';$('fSave').classList.add('danger','solid');return}
    if(isNew)dates.forEach(d=>S.seances.push({...s,...v,themes:v.themes.map(x=>({...x})),id:uid(),date:d,statut:'planifiee'}));
    else Object.assign(s,v);
    save();closeSheet();render();
    toast(isNew?(dates.length>1?`${dates.length} séances planifiées${enCg.length?` · ${enCg.length} semaine${enCg.length>1?'s':''} de congé sautée${enCg.length>1?'s':''}`:''}`:'Séance planifiée'):'Séance modifiée');
  };
  sheetEl.addEventListener('input',()=>{if(forced){forced=false;$('fSave').textContent='Enregistrer';$('fSave').classList.remove('danger','solid');$('fWarn').innerHTML=''}});
}

/* ---- Fiche joueur : niveaux en étoiles, taux par thème, récapitulatif ---- */
function lvRow(p,i,focus){
  const t=THEMES[i],v=(p.niveaux||{})[t]||0,ev=(p.evol||[]).filter(e=>e.t===t).slice(-1)[0];
  const tr=ev?(ev.to>ev.from?`<span class="trend up" title="${ev.from} → ${ev.to}">▲ ${fmtShort(ev.d)}</span>`:`<span class="trend down" title="${ev.from} → ${ev.to}">▼ ${fmtShort(ev.d)}</span>`):'<span class="trend"></span>';
  return `<div class="lv ${focus?'focus':''}" id="lv-${p.id}-${i}"><span class="lv-t">${esc(t)}${isCT(t)?'':` <span class="chip ext" title="${esc(extLabel(p,t))}">${esc(extShort(p,t))}</span>`}</span>
    <span class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=v?'on':''}" data-star="${p.id}|${i}|${n}" aria-label="${esc(t)} : ${n} sur 5">★</button>`).join('')}</span>${tr}</div>`;
}
function ficheHtml(p,focus=[],chart=false){
  const {m,tot}=tauxThemes(p.id);
  const order=[...THEMES.keys()].sort((a,b)=>(focus.includes(THEMES[b])?1:0)-(focus.includes(THEMES[a])?1:0));
  return `<div><h3 style="margin-bottom:4px">Niveaux par thème</h3><p class="small muted" style="margin:0 0 8px">Touchez une étoile pour ajuster le niveau observé (5 max). ${focus.length?'Les thèmes de cette séance sont en tête.':''}</p>
    <div class="lvs">${order.map(i=>lvRow(p,i,focus.includes(THEMES[i]))).join('')}</div></div>
  ${chart?`<div><h3 style="margin-bottom:8px">Taux de travail par thème</h3><div id="tx-${p.id}" class="list" style="gap:10px">${tauxBlock(p.id,0)}</div></div>`:`<div><h3 style="margin-bottom:8px">Taux de travail par thème${tot?` <span class="small num" style="text-transform:none">· ${fmtH(Math.round(tot))} de séances faites</span>`:''}</h3>
    ${tot?`<div class="bars">${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${n/tot*100}%"></i></span><b class="num">${Math.round(n/tot*100)}% <em>${fmtH(Math.round(n))}</em></b></div>`).join('')}</div>`
      :'<div class="muted small">Aucune séance faite pour l’instant.</div>'}</div>`}`;
}
/* ---- Préparation : priorités par thème pour planifier une séance ---- */
/* Indice de priorité (sur 100) = niveau (60) + peu de séances (20) + ancienneté (12) + régression (8) */
const PRIO_MAX={niv:50,seances:15,recence:10,regr:5,match:20};
function prioThemes(pid,exclId){
  const p=S.joueurs.find(x=>x.id===pid);if(!p)return [];
  const {m,tot}=tauxThemes(pid),t=today(),last={},cnt={};
  const done=S.seances.filter(s=>s.joueurId===pid&&s.statut==='faite'&&s.id!==exclId&&s.date<=t);
  done.forEach(s=>thList(s).forEach(x=>{cnt[x.t]=(cnt[x.t]||0)+1;if(!last[x.t]||s.date>last[x.t])last[x.t]=s.date}));
  const maxC=Math.max(1,...CT().map(x=>cnt[x]||0)),MR=themeMatch(pid);
  return CT().map(th=>{

    const ev=(p.evol||[]).filter(e=>e.t===th).slice(-1)[0],regr=ev&&ev.to<ev.from&&Math.round((parse(t)-parse(ev.d))/864e5)<=60?ev:null;

function whyHtml(r,rank,total){
  const L=[
    [r.pts.niv,PRIO_MAX.niv,r.lv?`Niveau ${r.lv}/5 : marge de progression de ${5-r.lv} étoile${5-r.lv>1?'s':''}`:'Niveau pas encore noté (compté comme 0/5)'],
    [r.pts.seances,PRIO_MAX.seances,r.c?`Travaillé dans ${r.c} séance${r.c>1?'s':''} sur ${r.nDone} (le thème le plus travaillé : ${r.maxC})`:r.nDone?`Jamais travaillé sur les ${r.nDone} séances faites`:'Aucune séance faite pour l’instant'],
    [r.pts.recence,PRIO_MAX.recence,r.ago===null?'Jamais travaillé : ancienneté maximale':r.ago===0?'Travaillé aujourd’hui':`Dernier travail il y a ${r.ago} jour${r.ago>1?'s':''} (maximum compté : 42 j)`],
    [r.pts.regr,PRIO_MAX.regr,r.regr?`Régression notée le ${fmtShort(r.regr.d)} (${r.regr.from} → ${r.regr.to} étoiles)`:'Pas de régression récente'],
    [r.pts.match,PRIO_MAX.match,matchWhy(r)]];
  const short=[r.lv?`niveau ${r.lv}/5`:'niveau non noté',r.c?`peu travaillé (${r.c} séance${r.c>1?'s':''})`:'jamais travaillé',r.c&&r.ago!==null?`pas travaillé depuis ${r.ago} j`:null,'régression récente','faiblesse en match'];
  const main=L.map((x,k)=>[x[0]/x[1],short[k]]).filter(x=>x[0]>0.25&&x[1]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);
  return `<div class="why"><div class="why-h"><b>${esc(r.th)} · indice ${r.score}/100</b><span class="small muted">rang ${rank+1} sur ${total}</span></div>

const nrm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function pdfSegs(items){
  const a=items.slice().sort((p,q)=>Math.round(p.y)-Math.round(q.y)||p.x-q.x),out=[];
  a.forEach(it=>{const l=out[out.length-1],same=l&&Math.abs(l.y-it.y)<=2.5&&it.x>=l.x;
    const gap=same?it.x-(l.x+l.w):99;
    if(same&&gap<1.6){l.s+=it.s;l.w=Math.max(l.w,it.x+it.w-l.x)}
    else if(same&&gap<7&&/^[^\d]/.test(it.s.trim())&&/[^\d%]$/.test(l.s.trim())){l.s+=' '+it.s;l.w=Math.max(l.w,it.x+it.w-l.x)}
    else out.push({x:it.x,y:it.y,w:it.w,s:it.s})});
  out.forEach(o=>o.s=o.s.replace(/\s+/g,' ').trim());return out.filter(o=>o.s);
}
function statKey(lab){const l=nrm(lab);
  if(/retour de 1/.test(l))return 'r1';if(/retour de 2/.test(l))return 'r2';if(/jeux de retour|break/.test(l)&&!/balles/.test(l))return 'jr';
  if(/derriere la 1/.test(l))return 'g1';if(/sur 2e balle|sur 2nde|2e balle/.test(l)&&/gagn/.test(l))return 'g2';
  if(/1re balle reussie|1ere balle reussie|premiere balle/.test(l))return 'p1';if(/jeux de service/.test(l))return 'js';
  if(/sauvee/.test(l))return 'bs';if(/converti/.test(l))return 'bc';if(/decisif/.test(l))return 'pd';return null}
function parseDetail(s){const d={};String(s||'').split(',').forEach(p=>{const m=p.trim().match(/^(.+?)\s+(\d+)$/);if(m)d[m[1].trim()]=(d[m[1].trim()]||0)+(+m[2])});return d}
function parseColumn(S){
  const r={stats:{},winners:{total:0,detail:{}},fautes:{total:0,detail:{}},fps:null,df:null,serie:null,plan:[],entretenir:[]};
  const top=S.slice().sort((a,b)=>a.y-b.y)[0];
  if(top){r.nom=top.s;const club=S.find(o=>o!==top&&Math.abs(o.y-top.y)<=3&&o.x>top.x);r.club=club?club.s:'';}
  const cm=(r.nom||'').match(/^(.*?)\s*\(([^)]*)\)\s*(.*)$/);
  if(cm){r.nom=cm[1].trim();r.classement=cm[2].trim();if(cm[3])r.club=cm[3].trim()}else r.classement='';
  const txt=S.map(o=>o.s).join('\n');
  const sm=txt.match(/S[ée]rie max\s*:\s*(\d+)/i);if(sm)r.serie=+sm[1];
  S.forEach(v=>{const m=v.s.match(/^(\d{1,3})\s?%$/);if(!m)return;
    const nd=S.find(o=>Math.abs(o.y-v.y)<=3&&o.x>v.x&&o.x<v.x+70&&/^\d+\s*\/\s*\d+$/.test(o.s));if(!nd)return;
    const lab=S.filter(o=>o.x<v.x-4&&Math.abs(o.y-v.y)<=15&&/[a-z]/i.test(o.s)&&!/^(SERVICE|RETOUR|MOMENTS|JEU)\b/.test(o.s)).sort((a,b)=>a.y-b.y||a.x-b.x).map(o=>o.s).join(' ');
    const k=statKey(lab);if(!k||r.stats[k])return;
    const [n,d]=nd.s.split('/').map(x=>+x.trim());
    const rp=S.filter(o=>/rep[eè]re\s*\d+/i.test(o.s)&&o.x>nd.x-2&&Math.abs(o.y-v.y)<=12).sort((a,b)=>Math.abs(a.y-v.y)-Math.abs(b.y-v.y))[0];
    r.stats[k]={n,d,rep:rp?+rp.s.match(/(\d+)/)[1]:null}});
  const jeu=(re,dst)=>{const lab=S.find(o=>re.test(o.s));if(!lab)return;
    const inl=lab.s.match(/(\d+)\s*(.*)$/);let num=null,det='';
    if(inl&&/^\D+\s\d/.test(lab.s)){num=+inl[1];det=inl[2]}
    const row=S.filter(o=>o!==lab&&Math.abs(o.y-lab.y)<=4&&o.x>lab.x).sort((a,b)=>a.x-b.x);
    row.forEach(o=>{if(num===null&&/^\d+$/.test(o.s))num=+o.s;else if(/[a-z]/i.test(o.s)&&/\d/.test(o.s))det+=(det?', ':'')+o.s});
    const more=S.filter(o=>o.y>lab.y+4&&o.y<lab.y+13&&row[0]&&o.x>=row[row.length-1].x-2&&/[a-z]/i.test(o.s)&&/\d/.test(o.s));
    more.forEach(o=>det+=', '+o.s);
    if(num!==null){dst.total=num;dst.detail=parseDetail(det)}};
  jeu(/^Winners\b/i,r.winners);jeu(/^Fautes directes\b/i,r.fautes);
  const fp=S.find(o=>/provoqu/i.test(o.s));
  if(fp){const cand=S.filter(o=>/^\d+$/.test(o.s)&&o.x>fp.x+25&&Math.abs(o.y-fp.y)<=18).sort((a,b)=>Math.abs(a.y-fp.y)-Math.abs(b.y-fp.y))[0];if(cand)r.fps=+cand.s}
  const dm=txt.replace(/\n/g,' ').match(/doubles? fautes\s*\((\d+)/i);if(dm)r.df=+dm[1];
  const lines=S.map(o=>o.s);let mode=null,buf=[];
  const flush=()=>{if(!buf.length)return;const t=buf.join(' ').replace(/\s+/g,' ').trim();
    if(mode==='plan')t.split(/(?=\b\d+\.\s*Priorit)/).map(x=>{x=x.trim();const i=x.search(/(\S+,\s*)?\S*\s*=\s*(au-dessus|en dessous|dans la norme)/);return (i>0?x.slice(0,i):x).trim()}).filter(Boolean).forEach(x=>r.plan.push(x.replace(/^\d+\.\s*/,'')));
    if(mode==='ent')(t.match(/[A-ZÀ-Ü][^()]*?\(\d+\s*\/\s*\d+\)/g)||[]).forEach(x=>r.entretenir.push(x.trim()));buf=[]};
  lines.forEach(l=>{if(/PLAN D.ENTRA/i.test(l)){flush();mode='plan';return}if(/ENTRETENIR/i.test(l)){flush();mode='ent';return}
    if(/^Rep[eè]res indicatifs/i.test(l)){flush();mode=null;return}if(mode&&!/^[\u{1F300}-\u{1FAFF}☀-➿]+$/u.test(l))buf.push(l.replace(/^[\u{1F300}-\u{1FAFF}☀-➿️]+\s*/u,''))});
  flush();return r;
}
function parseCarnet(pages){
  const res={date:'',categorie:'',tableau:'',score:'',vainqueur:'',pts:{},ptsJoues:null,cotes:[]};
  if(pages[0]){const S=pages[0].segs,L=S.map(o=>o.s);
    const dl=L.find(l=>/\d{2}\/\d{2}\/\d{4}/.test(l));
    if(dl){const m=dl.match(/(\d{2})\/(\d{2})\/(\d{4})/);res.date=`${m[3]}-${m[2]}-${m[1]}`;const parts=dl.split('·').map(x=>x.trim());res.categorie=parts[0]||'';res.tableau=parts.length>2?parts[1]:''}
    const sl=L.find(l=>/vainqueur/i.test(l));
    if(sl){const m=sl.match(/^(.*?)\s*·\s*vainqueur\s+(.+)$/i);if(m){res.score=m[1].trim();res.vainqueur=m[2].replace(/\s*\([^)]*\)\s*$/,'').trim()}}
    S.forEach(o=>{const m=o.s.match(/points gagn.s par (.+)$/i);const j=/points jou/i.test(o.s);if(!m&&!j)return;
      const num=S.filter(q=>/^\d+$/.test(q.s)&&q.y<o.y&&o.y-q.y<25&&Math.abs((q.x+q.w/2)-(o.x+o.w/2))<45).sort((a,b)=>b.y-a.y)[0];
      if(!num)return;if(j)res.ptsJoues=+num.s;else res.pts[nrm(m[1])]=+num.s})}
  const rest=pages.slice(1);if(rest.length){const mid=rest[0].w/2;
    [0,1].forEach(side=>{const items=[].concat(...rest.map(p=>p.items.filter(it=>side?it.x>=mid:it.x<mid)));res.cotes.push(parseColumn(pdfSegs(items)))})}
  res.cotes.forEach(c=>{const first=nrm(c.nom).split(' ')[0];const k=Object.keys(res.pts).find(x=>x&&(nrm(c.nom).includes(x)||x.includes(first)));c.pts=k?res.pts[k]:null});
  return res;
}

/* ---- Chiffrement (AES-GCM 256 bits, clé propre à chaque joueur) ---- */
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const newKey=()=>b64u(crypto.getRandomValues(new Uint8Array(32)));
async function chiffrer(keyB64,obj){const k=await crypto.subtle.importKey('raw',ub64u(keyB64),'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({app:'coach-uscm',type:'joueur-chiffre',v:1,iv:b64u(iv),ct:b64u(ct)})}
async function dechiffrer(keyB64,txt){const o=JSON.parse(txt);if(!o||o.app!=='coach-uscm'||!o.ct)throw new Error('format');
  const k=await crypto.subtle.importKey('raw',ub64u(keyB64),'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64u(o.iv)},k,ub64u(o.ct))))}
async function sha256(s){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));return [...h].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---- Connexion Google (jeton d'accès limité aux fichiers créés par l'appli) ---- */
let gTok=null,gClient=null,gWait=null;
function prechargerGoogle(){if(!driveReady()||window.Native||window.google&&google.accounts)return;loadScript('https://accounts.google.com/gsi/client','google').catch(()=>{})}
function googleToken(interactive){
  if(gTok&&gTok.exp>Date.now()+60000)return Promise.resolve(gTok.token);
  if(!interactive)return Promise.reject(Object.assign(new Error('Connexion Google nécessaire'),{code:'login'}));
  if(!driveReady())return Promise.reject(new Error('Le partage Google Drive n’est pas configuré dans cette version de l’appli.'));
  if(window.Native&&Native.googleLogin)return Native.googleLogin(CFG.googleClientId,[DRIVE_SCOPE]).then(t=>{gTok={token:t,exp:Date.now()+50*60000};return t});
  const ask=()=>new Promise((ok,ko)=>{
    if(!gClient)gClient=google.accounts.oauth2.initTokenClient({client_id:CFG.googleClientId,scope:DRIVE_SCOPE,callback:()=>{},error_callback:()=>{}});
    gClient.callback=r=>{if(r&&r.access_token){gTok={token:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};ok(r.access_token)}else ko(new Error(r&&r.error_description||'Connexion Google refusée'))};
    gClient.error_callback=e=>ko(new Error(e&&e.type==='popup_closed'?'Connexion annulée':'Fenêtre de connexion Google bloquée : autorisez les fenêtres pour ce site.'));
    gClient.requestAccessToken({prompt:''})});
  if(window.google&&google.accounts)return ask();
  return loadScript('https://accounts.google.com/gsi/client','google').then(ask,()=>{throw new Error('Google est injoignable : vérifiez la connexion.')});
}
async function gfetch(url,opt={},interactive){
  const tok=await googleToken(interactive);
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401){gTok=null;throw Object.assign(new Error('Session Google expirée : reconnectez-vous.'),{code:'login'})}
  if(!r.ok){const e=new Error(`Google Drive a répondu ${r.status}`);e.status=r.status;throw e}
  return r.status===204?null:r.json()}
async function driveCreate(meta,content,mime,interactive){
  const b='uscm'+Math.random().toString(36).slice(2);
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n${content}\r\n--${b}--`;
  return gfetch(`${DUP}/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},body},interactive)}
async function driveUpdate(id,content,mime,interactive){return gfetch(`${DUP}/files/${id}?uploadType=media&fields=id`,{method:'PATCH',headers:{'Content-Type':mime},body:content},interactive)}
async function driveSave(id,name,content,mime,parent,interactive){
  if(id){try{return (await driveUpdate(id,content,mime,interactive)).id}catch(e){if(e.status!==404&&e.status!==403)throw e}}
  return (await driveCreate({name,mimeType:mime,parents:parent?[parent]:undefined},content,mime,interactive)).id}
async function driveFolder(interactive){
  const D=S.drive=S.drive||{};
  if(D.folderId){try{const f=await gfetch(`${DAPI}/files/${D.folderId}?fields=id,trashed`,{},interactive);if(!f.trashed)return D.folderId}catch(e){if(e.code==='login')throw e}}
  D.folderId=(await gfetch(`${DAPI}/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`Coach Tennis – ${S.coach||'coach'}`,mimeType:'application/vnd.google-apps.folder'})},interactive)).id;
  return D.folderId}

function payloadJoueur(p){
  const t=today(),gs=S.groupes.filter(g=>g.joueurIds.includes(p.id)),cours=[];
  for(let i=-21;i<=63;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>{if(e.type!=='col'||!e.ref.joueurIds.includes(p.id))return;
    const ec=S.ecoles.find(x=>x.id===e.ref.ecoleId)||{},pr=S.presences[e.key];
    cours.push({key:e.key,date:d,debut:e.debut,fin:e.fin,court:e.court,groupe:e.ref.nom,ecole:ec.nom||'',lieu:ec.lieu||'',niveau:e.ref.niveau||'',
      annule:!!e.off,motif:e.conge?'Congé du coach':e.off?'Cours annulé':'',present:pr?pr.includes(p.id):null})})}
  const {m,tot,n}=tauxThemes(p.id);
  return {app:'coach-uscm',type:'joueur',v:1,publie:new Date().toISOString(),
    coach:{nom:S.coach||'',club:S.club||'',instance:instTxt(),tel:S.tel||''},
    joueur:{id:p.id,prenom:p.prenom,nom:p.nom,categorie:categorie(p.naissance),niveau:p.niveau,objectifs:p.notes||'',classements:p.classements||[]},
    themesCoach:CT(),niveaux:p.niveaux||{},evol:(p.evol||[]).slice(-30),externes:Object.fromEntries(THEMES.filter(x=>!isCT(x)).map(x=>[x,extLabel(p,x)])),
    seances:S.seances.filter(s=>s.joueurId===p.id&&s.date>=addDays(t,-180)).map(s=>({id:s.id,date:s.date,debut:s.debut,duree:+s.duree,court:s.court,themes:thList(s),statut:s.statut,notes:s.notes||''})),
    cours,groupes:gs.map(g=>{const ec=S.ecoles.find(x=>x.id===g.ecoleId)||{};return {nom:g.nom,ecole:ec.nom||'',lieu:ec.lieu||'',niveau:g.niveau||'',creneaux:g.creneaux.map(c=>({jour:+c.jour,debut:c.debut,duree:+c.duree,court:c.court}))}}),
    conges:(S.conges||[]).filter(c=>c.fin>=t).map(c=>({debut:c.debut,fin:c.fin,motif:c.motif||''})),
    matchs:matchesOf(p.id).slice(0,20).map(({joueurId,...x})=>x),taux:{m,tot,n}}}

/* ---- Changements à signaler au joueur ---- */
function snapJoueur(p){const t=today(),m={};
  S.seances.forEach(s=>{if(s.joueurId===p.id&&s.date>=t&&s.statut!=='annulee')m[s.id]=[s.date,s.debut,s.court,'i']});
  for(let i=0;i<=63;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>{if(e.type==='col'&&!e.off&&e.ref.joueurIds.includes(p.id))m[e.key]=[d,e.debut,e.court,'c',e.ref.nom]})}
  return {m,end:addDays(t,63)}}
function diffNotif(old,cur){const t=today(),nv=[],md=[],an=[];
  Object.entries(cur.m).forEach(([k,v])=>{const o=old.m[k];if(!o){if(v[3]==='i'||v[0]<=old.end)nv.push(v)}else if(o[0]!==v[0]||o[1]!==v[1]||o[2]!==v[2])md.push(v)});
  Object.entries(old.m).forEach(([k,o])=>{if(!cur.m[k]&&o[0]>=t)an.push(o)});
  const tot=nv.length+md.length+an.length;if(!tot)return null;
  const lab=v=>`${v[3]==='c'?v[4]+', ':''}${JC[dow(v[0])].toLowerCase()}. ${fmtShort(v[0])} à ${v[1]}`;
  const [L,un,plus]=nv.length?[nv,'Nouvelle séance','nouvelles séances programmées']:md.length?[md,'Séance modifiée','séances modifiées']:[an,'Séance annulée','séances annulées'];
  let txt=L.length===1?`${un} : ${lab(L[0])}`:`${L.length} ${plus}`;const autres=tot-L.length;if(autres)txt+=` (+${autres} changement${autres>1?'s':''})`;
  const enc=new TextEncoder();while(enc.encode(txt).length>110)txt=txt.slice(0,-2)+'…';return txt}

async function publier(interactive=true,silencieux=false){
  if(publishing)return;const L=partages();
  if(!driveReady()){toast('Le partage Google Drive n’est pas configuré dans cette version.');return}
  publishing=true;const btns=document.querySelectorAll('[data-publish]');btns.forEach(b=>{b.disabled=true;b.dataset.l=b.textContent;b.textContent='Publication…'});
  try{
    const folder=await driveFolder(interactive);let n=0;
    for(const p of L){const P=p.partage;if(!P.key)P.key=newKey();
      const cur=snapJoueur(p);if(!P.snap){P.rev=P.rev||1;P.notif='Ton programme est disponible'}else{const df=diffNotif(P.snap,cur);if(df){P.rev=(P.rev||1)+1;P.notif=df}}
      const pl=payloadJoueur(p);pl.rev=P.rev;pl.notif=P.notif;
      const txt=await chiffrer(P.key,pl),neuf=!P.fileId;

/* ============ Joueur : connexion par PIN, nouveautés, confirmations ============ */
PJ.profils=PJ.profils||{};PJ.rep=PJ.rep||{};PJ.vu=PJ.vu||{};PJ.essais=PJ.essais||{n:0,t:0};
let jUnlocked=null,jPaused=0;
async function hashPin(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64u(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub64u(salt),iterations:120000},k,256)))}
const profilsJ=()=>[...new Set(PJ.sources.filter(s=>s.data).map(s=>nomJ(s.data)))];
const fileOf=src=>src.code.split('.')[0];
function jVerrou(){const noms=profilsJ();if(!noms.length)return null;
  const sansPin=noms.find(n=>!PJ.profils[n]);if(sansPin)return vJCreerPin(sansPin);
  if(jUnlocked&&noms.includes(jUnlocked)){PJ.sel=jUnlocked;return null}
  return vJConnexion(noms)}
function vJCreerPin(nom){UI.pinNom=nom;const pr=nom.split(' ')[0];
  return `<div class="welcome jlock"><span class="ball big" aria-hidden="true"></span><h2>Bienvenue ${esc(pr)} !</h2>

  ${noms.length>1?`<div class="seg">${noms.map(n=>`<button type="button" data-jprof="${esc(n)}" aria-pressed="${n===sel}">${esc(n)}</button>`).join('')}</div>`:`<p class="muted" style="margin:0"><b>${esc(sel)}</b></p>`}
  <div class="pinf"><label class="fl">Ton code PIN<input id="jPinIn" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" ${att?'disabled':''}></label></div>
  <div id="pinW">${att?`<div class="warnbox">Trop d’essais : réessaie dans ${att} s.</div>`:''}</div>
  <button class="btn pri" type="button" id="jPinOk" ${att?'disabled':''}>Entrer</button>

  <div id="jForgot" hidden class="list" style="width:100%;max-width:420px;gap:8px"><p class="small muted" style="margin:0">Colle le lien (ou le code) envoyé par ton coach : tu pourras choisir un nouveau code.</p>
    <input id="jForgotCode" class="search" placeholder="https://…#j=…  ou  code"><button class="btn" type="button" id="jForgotOk">Choisir un nouveau code</button></div>
  <div style="margin-top:12px"><button class="btn ghost small" type="button" id="toCoach">Espace coach</button></div></div>`}
async function creerPin(){const a=$('pinN1').value,b=$('pinN2').value;
  if(!/^\d{4,6}$/.test(a)){$('pinW').innerHTML='<div class="warnbox">Le code doit contenir 4 à 6 chiffres.</div>';return}
  if(a!==b){$('pinW').innerHTML='<div class="warnbox">Les deux codes sont différents.</div>';return}
  const salt=b64u(crypto.getRandomValues(new Uint8Array(16)));PJ.profils[UI.pinNom]={salt,h:await hashPin(a,salt)};
  jUnlocked=UI.pinNom;PJ.sel=UI.pinNom;PJ.essais={n:0,t:0};marquerVus(true);saveJ();
  if(window.Native)Native.notifPermission(true).then(()=>bgConfig());
  render();toast('Code enregistré')}
async function verifierPin(){const nom=UI.pinNom,p=PJ.profils[nom],v=$('jPinIn').value;if(!p||!v)return;
  if(PJ.essais.t>Date.now())return;
  if(await hashPin(v,p.salt)===p.h){jUnlocked=nom;PJ.sel=nom;PJ.essais={n:0,t:0};saveJ();render();if(navigator.onLine!==false)actualiserJ(true);return}
  PJ.essais.n++;if(PJ.essais.n>=5)PJ.essais.t=Date.now()+30000*Math.pow(2,Math.min(PJ.essais.n-5,5));saveJ();
  if(PJ.essais.t>Date.now()){render();setTimeout(()=>{if(!jUnlocked)render()},PJ.essais.t-Date.now()+200);return}
  $('pinW').innerHTML=`<div class="warnbox">Code incorrect${PJ.essais.n>=3?` (${5-PJ.essais.n} essai${5-PJ.essais.n>1?'s':''} avant une pause)`:''}.</div>`;$('jPinIn').value='';$('jPinIn').focus()}
function oubliPin(){const c=parseCode($('jForgotCode').value),nom=UI.pinNom;
  const ok=c&&PJ.sources.some(s=>s.code===c&&s.data&&nomJ(s.data)===nom);

document.addEventListener('visibilitychange',()=>{if(document.hidden){jPaused=Date.now();return}

/* ---- Nouveautés et confirmations ---- */
const repSig=e=>`${e.date} ${e.debut}`;
function aRepondre(list){const t=today(),lim=addDays(t,7),nowH=new Date().toTimeString().slice(0,5);
  return agendaJ(list,t,addDays(t,27)).filter(e=>{if(e.type==='col'?e.annule:e.statut!=='planifiee')return false;if(e.type==='col'&&e.date>lim)return false;if(e.date===t&&e.fin<nowH)return false;return true})}
function repJ(e){const r=PJ.rep[`${fileOf(e.src)}|${e.key}`];if(!r)return null;return {...r,modifie:r.sig!==repSig(e)}}
function marquerVus(silent){PJ.sources.filter(s=>s.data).forEach(s=>{PJ.vu[fileOf(s)]=s.data.rev||0});if(!silent)saveJ()}
function bandeauNouveau(list){const L=list.filter(s=>(s.data.rev||0)>(PJ.vu[fileOf(s)]||0));if(!L.length)return '';
  return `<div class="jnew"><b>Nouveau</b><span>${L.map(s=>esc(s.data.notif||'Ton coach a mis à jour ton programme')).join('<br>')}</span><button class="btn" type="button" data-jvu>OK</button></div>`}
function repChipJ(e){const r=repJ(e);if(!r)return '';
  if(r.modifie)return '<span class="chip mmixte">Horaire modifié : à reconfirmer</span>';
  return r.st==='ok'?`<span class="chip mfort">✓ Présent${r.sent===false?' · envoi en attente':''}</span>`:`<span class="chip mfaible">✗ Absent${r.sent===false?' · envoi en attente':''}</span>`}
function repBtns(e,i){const r=repJ(e);
  return `<div class="jrep">${r&&!r.modifie?repChipJ(e)+`<button class="btn ghost small" type="button" data-jrep="chg|${i}">Changer</button>`:
    `<button class="btn pri" type="button" data-jrep="ok|${i}">Je serai présent</button><button class="btn" type="button" data-jrep="non|${i}">Je ne peux pas</button>`}</div>`}
const waNum=tel=>{let d=String(tel||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);if(d.startsWith('00'))return d.slice(2);if(/^0\d{9}$/.test(d))return '212'+d.slice(1);return d};
function texteRep(e,st,msg){const qui=e.src.data.joueur.prenom,quoi=e.type==='ind'?'la séance individuelle':`le cours ${e.groupe}`;
  return `${qui} : ${st==='ok'?'✅ je serai présent à':'❌ je ne pourrai pas venir à'} ${quoi} du ${fmtDate(e.date)} à ${e.debut}${msg?` — ${msg}`:''}`}
function repondre(e,st,msg){
  PJ.rep[`${fileOf(e.src)}|${e.key}`]={st,msg:msg||'',ts:new Date().toISOString(),sig:repSig(e),sent:!CFG.relaisUrl?'wa':false};saveJ();
  if(!CFG.relaisUrl){const n=waNum(e.src.data.coach.tel);const a=document.createElement('a');a.href=`https://wa.me/${n}?text=${encodeURIComponent(texteRep(e,st,msg))}`;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
  closeSheet();render();if(CFG.relaisUrl)envoyerReponses().then(n=>toast(n===0?'Réponse envoyée au coach':'Réponse enregistrée : elle partira dès le retour du réseau'))}
let repSending=false;
async function envoyerReponses(){if(!CFG.relaisUrl||repSending)return 0;repSending=true;let ko=0;
  for(const [k,r] of Object.entries(PJ.rep)){if(r.sent!==false)continue;const [f,...s]=k.split('|');
    try{const res=await fetch(CFG.relaisUrl,{method:'POST',body:JSON.stringify({f,s:s.join('|'),st:r.st,msg:r.msg,g:r.sig})});const j=await res.json();if(j.ok)r.sent=true;else ko++}catch(e){ko++}}
  repSending=false;saveJ();if(APPMODE==='joueur'&&jUnlocked)render();return ko}
function formAbsence(e){openSheet(`${head('Je ne peux pas venir')}<p class="small muted" style="margin:0">${e.type==='ind'?'Séance individuelle':esc(e.groupe)} · ${fmtDate(e.date)} à ${e.debut}</p>

  $('absOk').onclick=()=>repondre(e,'non',$('absMsg').value.trim())}
function bgConfig(){if(!window.Native||!Native.bgConfigurer||!CFG.googleApiKey)return;
  Native.bgConfigurer({key:CFG.googleApiKey,list:PJ.sources.filter(s=>s.data).map(s=>({f:fileOf(s),r:s.data.rev||0,prenom:s.data.joueur.prenom}))})}

/* ---- Côté coach : réponses des joueurs ---- */
let repLoading=false;
async function chargerReponses(quiet){if(!CFG.relaisUrl||repLoading||navigator.onLine===false)return;const L=partages().filter(p=>p.partage.fileId);if(!L.length)return;repLoading=true;
  try{const r=await fetch(`${CFG.relaisUrl}${CFG.relaisUrl.includes('?')?'&':'?'}ids=${L.map(p=>p.partage.fileId).join(',')}`),j=await r.json();
    const byF={};L.forEach(p=>byF[p.partage.fileId]=p.id);S.reponses=S.reponses||{};let nouv=0;
    (j.r||[]).forEach(x=>{const pid=byF[x.f];if(!pid)return;const k=`${pid}|${x.s}`,o=S.reponses[k];if(!o||o.t!==x.t){nouv++;S.reponses[k]={st:x.st,m:x.m||'',t:x.t,g:x.g||''}}});
    if(nouv){save(true);if(!sheetEl)render();toast(`${nouv} nouvelle${nouv>1?'s':''} réponse${nouv>1?'s':''} de joueurs`)}else if(!quiet)toast('Pas de nouvelle réponse')}
  catch(e){if(!quiet)toast('Réponses des joueurs indisponibles pour le moment')}finally{repLoading=false}}
function repCoach(pid,key,d,h){const p=S.joueurs.find(x=>x.id===pid);if(!p||!p.partage||!p.partage.actif||!CFG.relaisUrl)return null;
  const r=(S.reponses||{})[`${pid}|${key}`];if(!r)return {st:'att'};return {...r,ancien:r.g&&r.g!==`${d} ${h}`}}
function repChipC(r){if(!r)return '';if(r.ancien)return '<span class="chip mmixte">Réponse avant modification</span>';
  return r.st==='ok'?'<span class="chip mfort">✓ Confirmé</span>':r.st==='non'?'<span class="chip mfaible">✗ Absent</span>':'<span class="chip">⏳ En attente</span>'}
function repResumeCol(e){const L=e.ref.joueurIds.map(id=>repCoach(id,e.key,e.date,e.debut)).filter(Boolean);if(!L.length)return '';
  const ok=L.filter(r=>r.st==='ok'&&!r.ancien).length,non=L.filter(r=>r.st==='non'&&!r.ancien).length;
  return ` <span class="chip mfort">✓ ${ok}</span>${non?` <span class="chip mfaible">✗ ${non}</span>`:''}`}
function panneauReponses(){if(!CFG.relaisUrl||!partages().length)return '';const t=today(),it=[];
  for(let i=0;i<=7;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>{if(e.off)return;
    const ids=e.type==='ind'?[e.ref.joueurId]:e.ref.joueurIds;ids.forEach(pid=>{const r=repCoach(pid,e.type==='ind'?e.id:e.key,d,e.debut);if(r)it.push({e,d,pid,r})})})}
  if(!it.length)return '';const abs=it.filter(x=>x.r.st==='non'&&!x.r.ancien),att=it.filter(x=>x.r.st==='att'||x.r.ancien),ok=it.filter(x=>x.r.st==='ok'&&!x.r.ancien);
  return `<div class="panel"><div class="row between"><h3>Réponses des joueurs · 7 jours</h3><button class="btn ghost small" type="button" id="repRefresh">Actualiser</button></div>
    <div class="small" style="margin-top:6px"><span class="chip mfort">✓ ${ok.length} confirmé${ok.length>1?'s':''}</span> <span class="chip mfaible">✗ ${abs.length} absent${abs.length>1?'s':''}</span> <span class="chip">⏳ ${att.length} en attente</span></div>
    ${abs.length?`<div class="list" style="margin-top:8px;gap:6px">${abs.map(x=>`<div class="small"><b>${esc(pName(S.joueurs.find(p=>p.id===x.pid)))}</b> · ${JC[dow(x.d)]} ${fmtShort(x.d)} ${x.e.debut}${x.r.m?`<br><span class="muted">« ${esc(x.r.m)} »</span>`:''}</div>`).join('')}</div>`:''}</div>`}

  if(d.jcopy){const i=$('jl-'+d.jcopy)||$('jc-'+d.jcopy),v=i.value;try{navigator.clipboard.writeText(v).then(()=>toast('Copié'),()=>{i.select();toast('Sélectionné : copiez-le')})}catch(e){i.select()}return}
