    if(k==='ok')return repondre(e,'ok');if(k==='non')return formAbsence(e);
    delete PJ.rep[`${fileOf(e.src)}|${e.key}`];saveJ();return render()}
  if(d.jm!==undefined)return openJMatch(+d.jm);
  if(d.jdel!==undefined){if(!t.dataset.armed){t.dataset.armed=1;t.textContent='Confirmer';t.classList.add('solid');return}PJ.sources.splice(+d.jdel,1);saveJ();render();return toast('Programme retiré')}
  if(d.per){const[pid,days]=d.per.split('|');const b=$('tx-'+pid);if(b)b.innerHTML=tauxBlock(pid,+days);return}
  if(d.pdf)return exportPdf(d.pdf,t);
  if(d.mimport!==undefined)return importMatch(d.mimport||null);
  if(d.mnew)return formMatch({joueurId:d.mnew});
  if(d.mid)return openMatch(d.mid);
  if(d.medit)return formMatch((S.matchs||[]).find(x=>x.id===d.medit));
  if(d.mcible){const[pid,mid]=d.mcible.split('|');return planCible(pid,mid)}
  if(d.cladd){const pid=d.cladd,p=S.joueurs.find(x=>x.id===pid);const v=$('clV-'+pid).value.trim(),dt=$('clD-'+pid).value;
    if(!v||!dt){$('clM-'+pid).textContent='Indiquez la date et le classement.';$('clM-'+pid).style.color='var(--danger)';return}
    p.classements=p.classements||[];p.classements.push({date:dt,valeur:v,points:$('clP-'+pid).value.trim(),note:$('clN-'+pid).value.trim()});save();$('cl-'+pid).innerHTML=clHtml(p);return toast('Classement ajouté')}
  if(d.cldel){const[pid,i]=d.cldel.split('|'),p=S.joueurs.find(x=>x.id===pid);p.classements.splice(+i,1);save();$('cl-'+pid).innerHTML=clHtml(p);return toast('Classement supprimé')}
  if(d.star){const[pid,i,n]=d.star.split('|');return setStar(pid,+i,+n)}
  if('close' in d)return closeSheet();
  if(d.sid)return openSeance(d.sid);
  if(d.gkey)return openCours(d.gkey);
  if(d.pid)return openJoueur(d.pid);
  if(d.why){const w=$('why-'+d.why);if(w){w.hidden=!w.hidden;t.setAttribute('aria-expanded',String(!w.hidden))}return}
  if(d.plan!==undefined)return formSeance(null,{joueurId:d.plan,theme:d.pth});
  if(d.newseance!==undefined)return formSeance(null,d.newseance?{date:d.newseance,debut:d.h}:{});
  if(d.dadd){const j=+d.dadd,r=UI.dd[j],l=r[r.length-1];r.push(l?{debut:l.fin,fin:fromMin(Math.min(toMin(l.fin)+120,23*60+45))}:{debut:'09:00',fin:'12:00'});$('dispoBox').innerHTML=dispoEditor();return}
  if(d.drm){const[j,i]=d.drm.split('|').map(Number);UI.dd[j].splice(i,1);$('dispoBox').innerHTML=dispoEditor();return}
  if(d.cdel){S.conges=S.conges.filter(c=>c.id!==d.cdel);save();render();return toast('Congé supprimé')}
  if(d.newplayer!==undefined)return formJoueur();
  if(d.newschool!==undefined)return formEcole();
  if(d.editschool)return formEcole(S.ecoles.find(x=>x.id===d.editschool));
  if(d.newgroup!==undefined)return formGroupe(null,d.newgroup);
  if(d.editgroup)return formGroupe(S.groupes.find(x=>x.id===d.editgroup));
  if(d.wk!==undefined){UI.week=d.wk==='0'?monday(today()):addDays(UI.week,7*+d.wk);return render()}
  switch(t.id){
    case 'jPinCreate':return creerPin();
    case 'jPinOk':return verifierPin();
    case 'jPinForgot':$('jForgot').hidden=false;return $('jForgotCode').focus();
    case 'jForgotOk':return oubliPin();
    case 'jLock':jUnlocked=null;closeSheet();return render();
    case 'jPinChange':delete PJ.profils[jUnlocked];UI.pinNom=jUnlocked;jUnlocked=null;saveJ();return render();
    case 'repRefresh':return chargerReponses(false);
    case 'pickCoach':return setMode('coach');
    case 'pickJoueur':return setMode('joueur');
    case 'toJoueur':return setMode('joueur');
    case 'toCoach':return versCoach();
    case 'driveRestore':return restaurerDrive();
    case 'jAddBtn':{const v=$('jAdd').value;t.disabled=true;return ajouterCode(v).then(ok=>{t.disabled=false;if(ok)render()})}
    case 'pinSave':{const a=$('pinA').value,b=$('pinB').value;
      if(!/^\d{4,8}$/.test(a)){$('pinMsg').textContent='Le code doit contenir 4 à 8 chiffres.';$('pinMsg').style.color='var(--danger)';return}
      if(a!==b){$('pinMsg').textContent='Les deux saisies sont différentes.';$('pinMsg').style.color='var(--danger)';return}
      return sha256('uscm-pin:'+a).then(h=>{S.pin=h;save();render();toast('Code de l’espace coach enregistré')})}
    case 'pinDel':S.pin=null;save();render();return toast('Code supprimé');
    case 'quickAdd':if(APPMODE==='joueur')return actualiserJ();return formSeance(null,UI.tab==='planning'&&UI.week!==monday(today())?{date:UI.week}:{});
    case 'saveSettings':S.coach=$('sCoach').value.trim();S.club=$('sClub').value.trim();
      S.pays=$('sPays').value.trim();S.tel=$('sTel').value.trim();S.instanceSigle=$('sSigle').value.trim();S.instanceNom=$('sInst').value.trim();
      S.courts=$('sCourts').value.split(',').map(x=>x.trim()).filter(Boolean);if(!S.courts.length)S.courts=['Court 1'];save();render();return toast('Réglages enregistrés');
    case 'saveTc':{const sel=[...$('tcBox').querySelectorAll(':checked')].map(x=>x.value);
      if(!sel.length){$('tcMsg').textContent='Cochez au moins un thème.';$('tcMsg').style.color='var(--danger)';return}
      S.themesCoach=THEMES.filter(t=>sel.includes(t));save();render();return toast(`${sel.length} thème${sel.length>1?'s':''} retenu${sel.length>1?'s':''}`)}
    case 'saveDispo':{const bad=[];
      for(let j=1;j<=7;j++){UI.dd[j]=(UI.dd[j]||[]).slice().sort((a,b)=>a.debut.localeCompare(b.debut));
        UI.dd[j].forEach((r,i)=>{if(!r.debut||!r.fin||r.debut>=r.fin)bad.push(`${JOURS[j]} : la fin doit être après le début`);
          else if(i&&r.debut<UI.dd[j][i-1].fin)bad.push(`${JOURS[j]} : deux plages se chevauchent`)})}
      if(bad.length){$('dMsg').textContent=bad[0];$('dMsg').style.color='var(--danger)';return}
      S.dispo=JSON.parse(JSON.stringify(UI.dd));save();render();return toast('Disponibilités enregistrées')}
    case 'addConge':{const a=$('cD').value,b=$('cF').value;
      if(!a||!b||b<a){$('cMsg').textContent='La date de fin doit être le même jour ou après la date de début.';$('cMsg').style.color='var(--danger)';return}
      S.conges.push({id:uid(),debut:a,fin:b,motif:$('cM').value.trim()});save();render();return toast('Congé ajouté')}
    case 'copyBk':{const txt=JSON.stringify(S);const ok=()=>toast('Sauvegarde copiée');
      const fb=()=>{$('bkIn').value=txt;$('bkIn').select();$('bkMsg').textContent='Copie automatique impossible : le texte est sélectionné, copiez-le manuellement.'};
      try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}return}
    case 'fileBk':{return offerFile(`Sauvegarde_CoachTennis_${today()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}),'Sauvegarde exportée')}
    case 'loadBk':{const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json,text/plain';
      inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{restoreFrom(JSON.parse(await f.text()))}catch(e){toast('Ce fichier n’est pas une sauvegarde de Coach Tennis')}};inp.click();return}
    case 'restoreBk':try{restoreFrom(JSON.parse($('bkIn').value))}
      catch(e){$('bkMsg').textContent='Ce texte n’est pas une sauvegarde valide de l’application.';$('bkMsg').style.color='var(--danger)'}return;
    case 'wipe':$('wipeConfirm').innerHTML='<div class="warnbox">Tous les joueurs, séances et écoles seront effacés de cet appareil.</div><div class="row" style="margin-top:8px"><button class="btn danger solid" type="button" id="wipeYes">Tout effacer</button></div>';return;
    case 'wipeYes':S={v:1,demo:false,coach:S.coach,club:S.club,courts:S.courts,joueurs:[],ecoles:[],groupes:[],seances:[],annulations:{},presences:{},dispo:S.dispo,conges:[],matchs:[],
      themesCoach:S.themesCoach,pays:S.pays,instanceSigle:S.instanceSigle,instanceNom:S.instanceNom,pin:S.pin,drive:Object.assign({},S.drive,{backupId:S.drive&&S.drive.backupId})};save();render();return toast('Données effacées');
    case 'reseed':S=seed();save();render();return toast('Exemple rechargé');
  }
});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){UI.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('change',ev=>{const el=ev.target,k=el.dataset&&el.dataset.dk;if(!k)return;const row=el.closest('[data-j]');if(!row)return;const j=+row.dataset.j;
  if(k==='on'){UI.dd[j]=el.checked?[j<=5?{debut:'16:00',fin:'21:00'}:{debut:'09:00',fin:'13:00'}]:[];$('dispoBox').innerHTML=dispoEditor();return}
  const ri=+el.closest('[data-ri]').dataset.ri;UI.dd[j][ri][k]=el.value});
document.addEventListener('change',ev=>{const el=ev.target,x=el.dataset&&(el.dataset.ext||el.dataset.extn);if(!x)return;
  const[pid,i]=x.split('|'),p=S.joueurs.find(q=>q.id===pid);if(!p)return;const t=THEMES[+i];
  p.externes=p.externes||{};const e=p.externes[t]=p.externes[t]||{};
  if(el.dataset.ext){e.mode=el.value;const n=el.parentNode.querySelector('[data-extn]');if(n)n.hidden=e.mode!=='coach'}else e.nom=el.value.trim();
  if(!e.mode&&!e.nom)delete p.externes[t];save();
  const row=document.getElementById(`lv-${pid}-${i}`);if(row)row.outerHTML=lvRow(p,+i,row.classList.contains('focus'));toast(`${t} : ${extLabel(p,t)}`)});
document.addEventListener('change',ev=>{if(ev.target.id==='sPays'&&/^maroc$/i.test(ev.target.value.trim())){$('sSigle').value='FRMT';$('sInst').value='Fédération Royale Marocaine de Tennis'}});
document.addEventListener('change',async ev=>{const id=ev.target.id;if(id!=='rOn'&&id!=='rAv')return;
  const on=$('rOn').checked,avant=+$('rAv').value;
  if(on&&!(await Native.notifPermission(true))){$('rOn').checked=false;$('rMsg').textContent='Notifications refusées : autorisez-les dans les réglages du téléphone pour Coach Tennis.';return}
  S.rappels={on,avant};save();$('rMsg').textContent=on?`Rappels actifs, ${avant>=60?avant/60+' h':avant+' min'} avant chaque créneau.`:'Rappels désactivés.'});
document.addEventListener('change',async ev=>{const id=ev.target.id;if(id!=='jrOn'&&id!=='jrAv')return;
  const on=$('jrOn').checked;if(on&&!(await Native.notifPermission(true))){$('jrOn').checked=false;$('jrMsg').textContent='Notifications refusées : autorisez-les dans les réglages du téléphone.';return}
  PJ.rappels={on,avant:+$('jrAv').value};saveJ();$('jrMsg').textContent=on?'Rappels actifs.':'Rappels désactivés.'});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const m={jAdd:'jAddBtn',jPinIn:'jPinOk',pinN2:'jPinCreate',jForgotCode:'jForgotOk'}[ev.target.id];if(m&&$(m)){ev.preventDefault();$(m).click()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});
/* Session au démarrage : lien joueur reçu, ou choix coach / joueur */
const lienRecu=parseCode(location.hash);
if(lienRecu){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(APPMODE!=='joueur'){APPMODE='joueur';try{localStorage.setItem(MODE_KEY,'joueur')}catch(e){}}}
if(!APPMODE&&fromLocal){APPMODE='coach';try{localStorage.setItem(MODE_KEY,'coach')}catch(e){}}
render();
if(lienRecu)ajouterCode(lienRecu).then(()=>render());
else if(APPMODE==='joueur'&&PJ.sources.length&&navigator.onLine!==false)actualiserJ(true);
if(APPMODE==='coach'){prechargerGoogle();setTimeout(()=>chargerReponses(true),1500)}
/* Appli installée depuis le navigateur : demander un stockage durable */
try{if(!window.Native&&navigator.storage&&navigator.storage.persist&&matchMedia('(display-mode: standalone)').matches)navigator.storage.persist()}catch(e){}
/* ---- Démarrage dans l'appli mobile ---- */
if(window.Native){
  Native.onBack(()=>{if(sheetEl){closeSheet();return true}const home=APPMODE==='joueur'?'jprog':'jour';if(APPMODE&&UI.tab!==home){go(home);return true}return false});
  Native.onPause(()=>Native.flush());
  Promise.all([Native.restore(),Native.kvGet?Native.kvGet(MODE_KEY):null,Native.kvGet?Native.kvGet(PJ_KEY):null]).then(([j,m,pj])=>{
    let restored=false;if(j&&!fromLocal){try{const o=JSON.parse(j);if(o&&o.joueurs){S=migrate(o);restored=true;try{localStorage.setItem(KEY,j)}catch(e){}}}catch(e){}}
    else if(!j&&fromLocal)Native.persist(JSON.stringify(S));
    if(!APPMODE&&!lienRecu&&(m||restored)){APPMODE=m||'coach';try{localStorage.setItem(MODE_KEY,APPMODE)}catch(e){}}
    if(pj&&!PJ.sources.length){try{PJ=Object.assign(PJ,JSON.parse(pj));localStorage.setItem(PJ_KEY,pj)}catch(e){}}
    render();planRappels();Native.hideSplash()});
}
</script>
