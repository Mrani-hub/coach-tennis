# Compile Coach Tennis à chaque envoi sur la branche main (ou à la demande : onglet Actions → Run workflow).
#
#  Android : APK signé à envoyer directement aux coachs (secrets ANDROID_*).
#            Il est aussi joint à une « Release » GitHub : lien de téléchargement fixe
#            …/releases/latest/download/CoachTennis.apk
#  iPhone  : appli web installable depuis Safari (écran d'accueil), téléchargeable en artifact
#            et mise en ligne sur GitHub Pages si la variable PUBLIER_PAGES vaut true.
#  iOS natif (option payante, compte Apple Developer) : TestFlight si la variable IOS_TESTFLIGHT vaut true.
name: Compiler les applis

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERSION_NAME: 1.0.${{ github.run_number }}
  VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Outils Android (préinstallés sur la machine GitHub)
        run: |
          echo "SDK : $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Installer et préparer l'appli
        run: |
          npm ci
          npm run build:web
          npx cap sync android
      - name: Clé de signature
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/cle-release.jks"
          echo "USCM_KEYSTORE_PATH=$RUNNER_TEMP/cle-release.jks" >> "$GITHUB_ENV"
      - name: Compiler l'APK
        working-directory: android
        env:
          USCM_VERSION_CODE: ${{ env.VERSION_CODE }}
          USCM_VERSION_NAME: ${{ env.VERSION_NAME }}
          USCM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USCM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USCM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/sortie"
          if [ -n "$USCM_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sortie/CoachTennis.apk"
            echo "### ✅ APK Coach Tennis $VERSION_NAME signé" >> "$GITHUB_STEP_SUMMARY"
            echo "Téléchargez l'artifact **CoachTennis-$VERSION_NAME-Android** ci-dessous, ou la Release du dépôt." >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sortie/CoachTennis-TEST.apk"
            echo "### ⚠️ APK de test uniquement" >> "$GITHUB_STEP_SUMMARY"
            echo "Les secrets ANDROID_* ne sont pas renseignés : cet APK ne pourra pas être mis à jour par-dessus. Ne l'envoyez pas aux coachs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Artifact APK
        uses: actions/upload-artifact@v5
        with:
          name: CoachTennis-${{ env.VERSION_NAME }}-Android
          path: sortie/*.apk
      - name: Release (lien de téléchargement fixe)
        if: env.KS_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Coach Tennis ${{ env.VERSION_NAME }}
          files: sortie/CoachTennis.apk
          make_latest: true
          body: |
            APK Android de Coach Tennis, version ${{ env.VERSION_NAME }}.
            Installation : ouvrir CoachTennis.apk sur le téléphone et autoriser l'installation depuis cette source.
            Une version déjà installée est mise à jour sans perte de données.

  iphone:
    name: iPhone (appli web installable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Construire
        run: |
          npm ci
          npm run build:pwa
      - name: Artifact (dossier à héberger)
        uses: actions/upload-artifact@v5
        with:
          name: CoachTennis-${{ env.VERSION_NAME }}-iPhone-web
          path: pwa/
      - name: Préparer GitHub Pages
        if: vars.PUBLIER_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/

  pages:
    name: Mise en ligne (GitHub Pages)
    if: vars.PUBLIER_PAGES == 'true'
    needs: iphone
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: |
          echo "### 📱 Version iPhone en ligne" >> "$GITHUB_STEP_SUMMARY"
          echo "Lien à envoyer aux coachs : ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  ios-testflight:
    name: iOS natif (TestFlight, option)
    if: vars.IOS_TESTFLIGHT == 'true'
    runs-on: macos-15
    env:
      ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer et préparer l'appli
        run: |
          npm ci
          npm run build:web
          npx cap sync ios
      - name: Archiver, signer et envoyer sur TestFlight
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          sed "s/__TEAM_ID__/${TEAM_ID}/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CoachTennis.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            "${AUTH[@]}" archive | tail -20
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CoachTennis.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -20
